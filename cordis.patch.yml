# 计费罗盘 · Billing Compass
# 这一行把插件注册进当前 profile。config 全部可选:
#   balanceKeyRef / platformTokenRef  凭据名(默认 DEEPSEEK_API_KEY / DEEPSEEK_USER_TOKEN)
#   balanceIntervalMs                 余额刷新间隔(默认 30000)
#   officialIntervalMs                官网用量刷新间隔(默认 300000)
#   costIntervalMs                    官网消费导出刷新间隔(默认 1800000,zip 较重)
#   cacheDir                          磁盘缓存目录(默认 $DSH_HOME/cache/dsh-billing-compass)
#   retryIntervalMs                   失败/未配置时的重试间隔(默认 30000)
#   sessionLog                        是否解析本地会话日志做"整段对话"统计(默认 true)
#   cnHolidays                        额外的中国法定节假日 YYYY-MM-DD(全天按空闲价)
#   updateCheck                       是否检查新版本(默认 true,查 npm dist-tags)
#   updateCheckIntervalMs             检查间隔(默认 21600000,即 6 小时)
#   pricing                           单价覆盖,单位 CNY / 1M tokens,可写 { peak, offPeak }
- insert:
    - id: dsh-billing-compass
      name: dsh-billing-compass
      config: {}
# 需要自定义时,把 config 换成例如:
#      config:
#        balanceKeyRef: MY_DEEPSEEK_KEY
#        pricing:
#          deepseek-flash:
#            offPeak: { input: 1, cacheHit: 0.02, output: 4 }
#            peak: { input: 2, cacheHit: 0.04, output: 8 }
